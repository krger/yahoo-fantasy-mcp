version: 2
updates:
  # Python dependencies, resolved from uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    # Monthly: this schedule only drives routine currency bumps. Security
    # updates open as soon as an alert appears, independent of it, and CI's
    # pip-audit step fails on advisories Dependabot hasn't raised yet.
    schedule:
      interval: "monthly"
    # Include transitive deps. The default ("direct") only bumps what
    # pyproject.toml names, so everything pulled in via mcp et al. drifted
    # until an advisory forced it (caught up by hand in v2.7.5-v2.7.7).
    allow:
      - dependency-type: "all"
    # Assign so the PR notifies via "participating" — the repo is unwatched,
    # and an unassigned bot PR mentions nobody, so it reaches no inbox.
    assignees:
      - "krger"
    open-pull-requests-limit: 10
    groups:
      # Split by what the merge means for a deploy: a dev bump never reaches
      # the --no-dev tree (no tag, no restart). The split is approximate:
      # Dependabot puts only *direct* dev deps (pytest, ruff, hatchling) in
      # the dev group and files every transitive dep, including pytest-only
      # ones like pluggy/iniconfig, under runtime. So a runtime PR usually
      # ships to prod, but `uv sync --no-dev` output decides. Majors stay
      # out of both groups so they get individual review.
      runtime-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Keep the CI workflow's pinned actions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "krger"
