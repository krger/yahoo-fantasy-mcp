[project]
name = "yahoo-fantasy-mcp"
version = "2.2.1"
description = "MCP server for Yahoo Fantasy Sports (baseball, football)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.0.0",
    "yahoo_fantasy_api>=2.12.2",
    "yahoo_oauth>=2.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Pinned explicitly rather than riding ruff's defaults, which 0.16.0 widened
# from 59 rules to 413 — a lint policy change should be deliberate, not
# something a version bump delivers. On top of pyflakes/pycodestyle + import
# sorting: B (bugbear) for real defect classes, DTZ for unintended naive
# datetimes, SIM/UP for mechanical modernization.
select = ["E4", "E7", "E9", "F", "I", "B", "DTZ", "SIM", "UP"]

# B008: flags the shared default `params` instances (`ListTeamsInput()`),
#       which are deliberate and safe because `LeagueScopedInput` is frozen.
# UP045: `Optional[X]` -> `X | None` is churn across the schema contract for
#        no behavior change; not worth the diff against the Pydantic models.
ignore = ["B008", "UP045"]